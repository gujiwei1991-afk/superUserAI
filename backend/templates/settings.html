{% extends "base.html" %}

{% block title %}系统设置{% endblock %}

{% block content %}
<div class="space-y-8">
    <div>
        <h1 class="text-3xl font-semibold text-slate-900">系统设置</h1>
        <p class="mt-2 text-sm text-slate-500">管理 SuperUserAI 的全局配置。</p>
    </div>

    {% if saved %}
    <div class="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">
        配置已保存。
    </div>
    {% endif %}

    <form method="post" action="/admin/settings" class="space-y-6">
        {% for group in settings_groups %}
        <section class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
            <div>
                <h2 class="text-lg font-semibold text-slate-900">{{ group.title }}</h2>
                <p class="mt-1 text-sm text-slate-500">{{ group.subtitle }}</p>
            </div>

            <div class="mt-6 grid gap-4 md:grid-cols-2">
                {% for field in group.fields %}
                <label class="block {% if field.full_width %}md:col-span-2{% endif %}">
                    <span class="flex items-start justify-between gap-3">
                        <span class="pr-3">
                            <span class="block text-sm font-medium text-slate-700">{{ field.label }}</span>
                            <span class="mt-1 block text-xs text-slate-500">{{ field.description }}</span>
                        </span>
                        <span class="shrink-0 rounded-full px-3 py-1 text-xs font-medium ring-1 {{ field.source_class }}">{{ field.source_label }}</span>
                    </span>

                    {% if field.kind == "select" %}
                    <select name="{{ field.name }}" class="mt-3 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-slate-400 focus:bg-white">
                        {% for option in field.options %}
                        <option value="{{ option }}" {% if option == field.value %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                    </select>
                    {% else %}
                    <input
                        type="{{ field.input_type }}"
                        name="{{ field.name }}"
                        class="mt-3 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-slate-400 focus:bg-white"
                        {% if field.input_type == "password" %}autocomplete="new-password"{% endif %}
                        {% if field.input_type != "password" %}value="{{ field.value }}"{% endif %}
                        {% if field.step %}step="{{ field.step }}"{% endif %}
                        {% if field.input_type == "password" and field.masked_value %}
                        placeholder="{{ field.masked_value }}"
                        {% elif field.placeholder %}
                        placeholder="{{ field.placeholder }}"
                        {% endif %}
                    >
                    {% endif %}

                    {% if field.input_type == "password" %}
                    <p class="mt-2 text-xs text-slate-500">
                        {% if field.masked_value %}
                        当前值：{{ field.masked_value }}。留空则保持不变。
                        {% else %}
                        留空则保持当前值不变。
                        {% endif %}
                    </p>
                    {% endif %}
                </label>
                {% endfor %}
            </div>
        </section>
        {% endfor %}

        <div class="flex justify-end">
            <button type="submit" class="rounded-2xl bg-slate-900 px-5 py-3 text-sm font-medium text-white hover:bg-slate-800">
                保存配置
            </button>
        </div>
    </form>
</div>
{% endblock %}
