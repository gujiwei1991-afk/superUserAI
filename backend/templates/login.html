{% extends "base.html" %}

{% block title %}管理员登录{% endblock %}

{% block content %}
<div class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/70">
    <div class="mb-8 text-center">
        <p class="text-sm font-medium uppercase tracking-[0.3em] text-slate-400">Admin Panel</p>
        <h1 class="mt-3 text-3xl font-semibold text-slate-900">管理员登录</h1>
        <p class="mt-2 text-sm text-slate-500">使用管理员账号进入审核后台。</p>
    </div>

    {% if error %}
    <div class="mb-6 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-5">
        <label class="block">
            <span class="mb-2 block text-sm font-medium text-slate-700">用户名</span>
            <input
                type="text"
                name="username"
                value="{{ username or '' }}"
                class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-400 focus:bg-white"
                placeholder="admin"
                required
            >
        </label>

        <label class="block">
            <span class="mb-2 block text-sm font-medium text-slate-700">密码</span>
            <input
                type="password"
                name="password"
                class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-slate-400 focus:bg-white"
                placeholder="请输入密码"
                required
            >
        </label>

        <button
            type="submit"
            class="w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-medium text-white transition hover:bg-slate-800"
        >
            登录
        </button>
    </form>
</div>
{% endblock %}
