[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superuserai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "anthropic>=0.40,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
# 仅收集 tests/ 下的单元测试（test_*.py）。
# e2e_*.py 是需要真实 DB/网络的手动冒烟脚本，文件名不匹配 python_files，故 pytest 自动跳过。
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# 让 `app.*` 与 `shared.*` 无需在每个测试文件里手动 sys.path.insert 即可导入。
pythonpath = [".", "../shared"]
addopts = "-q --strict-markers"
